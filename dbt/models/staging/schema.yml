version: 2

models:
  - name: stg_api_orders
    description: Pedidos da API tipados e limpos para o lote indicado por run_date.
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ source('northmart', 'dim_customer') }}"
                field: customer_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ source('northmart', 'dim_product') }}"
                field: product_id

      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ source('northmart', 'dim_seller') }}"
                field: seller_id

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved

      - name: order_purchase_timestamp
        tests:
          - not_null

      - name: price
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: freight_value
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: true

